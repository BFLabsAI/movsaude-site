<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html,body{ margin:0; height:100%; background:transparent; font-family:'Source Sans 3',system-ui,sans-serif; }
  #wrap{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  svg{ width:100%; height:100%; display:block; overflow:visible; }
  .land{ fill:#EAF0F8; stroke:#C6D3E6; stroke-width:1; }
  .pin-core{ transition:r .2s; }
  @keyframes pulse { 0%{ r:8; opacity:.5; } 70%{ r:22; opacity:0; } 100%{ r:22; opacity:0; } }
  @keyframes pulseSoft { 0%{ r:6; opacity:.4; } 70%{ r:16; opacity:0; } 100%{ r:16; opacity:0; } }
  .ring{ animation:pulse 2.6s ease-out infinite; }
  .ring-ev{ animation:pulseSoft 3.2s ease-out infinite; }
</style>
</head>
<body>
<div id="wrap"><svg id="map" viewBox="0 0 560 620" aria-label="Mapa do Brasil com unidades MovSaúde"></svg></div>
<script>
const W=560,H=620;
/* op = operação · im = implantação · ev = estudo de viabilidade */
const cities=[
  // Em operação
  {n:"Fortaleza",c:[-38.54,-3.73],s:"op"},
  // Em implantação
  {n:"São Luís",c:[-44.30,-2.53],s:"im"},
  {n:"Santa Quitéria",c:[-42.70,-4.32],s:"im"},
  {n:"Parnaíba",c:[-41.78,-2.90],s:"im"},
  {n:"Itararé",c:[-49.14,-24.11],s:"im"},
  {n:"Boa Vista",c:[-60.67,2.82],s:"im"},
  // Estudos de viabilidade (presença comercial / prospecção — espalhados no país)
  {n:"Manaus",c:[-60.02,-3.10],s:"ev"},
  {n:"Belém",c:[-48.50,-1.46],s:"ev"},
  {n:"Macapá",c:[-51.07,0.03],s:"ev"},
  {n:"Palmas",c:[-48.33,-10.18],s:"ev"},
  {n:"Teresina",c:[-42.80,-5.09],s:"ev"},
  {n:"Natal",c:[-35.21,-5.79],s:"ev"},
  {n:"João Pessoa",c:[-34.86,-7.12],s:"ev"},
  {n:"Recife",c:[-34.88,-8.05],s:"ev"},
  {n:"Maceió",c:[-35.74,-9.67],s:"ev"},
  {n:"Aracaju",c:[-37.07,-10.95],s:"ev"},
  {n:"Salvador",c:[-38.51,-12.97],s:"ev"},
  {n:"Vitória",c:[-40.31,-20.32],s:"ev"},
  {n:"Rio de Janeiro",c:[-43.20,-22.90],s:"ev"},
  {n:"Belo Horizonte",c:[-43.94,-19.92],s:"ev"},
  {n:"São Paulo",c:[-46.63,-23.55],s:"ev"},
  {n:"Campinas",c:[-47.06,-22.91],s:"ev"},
  {n:"Curitiba",c:[-49.27,-25.43],s:"ev"},
  {n:"Florianópolis",c:[-48.55,-27.60],s:"ev"},
  {n:"Porto Alegre",c:[-51.23,-30.03],s:"ev"},
  {n:"Campo Grande",c:[-54.62,-20.44],s:"ev"},
  {n:"Cuiabá",c:[-56.10,-15.60],s:"ev"},
  {n:"Goiânia",c:[-49.25,-16.68],s:"ev"},
  {n:"Brasília",c:[-47.93,-15.78],s:"ev"},
  {n:"Porto Velho",c:[-63.90,-8.76],s:"ev"},
  {n:"Rio Branco",c:[-67.81,-9.97],s:"ev"},
  {n:"Imperatriz",c:[-47.48,-5.53],s:"ev"},
  {n:"Petrolina",c:[-40.50,-9.39],s:"ev"},
  {n:"Uberlândia",c:[-48.28,-18.92],s:"ev"},
];
const COLORS={ op:"#2D9CDB", im:"#6BBF3A", ev:"#94A3B8" };
const LABELS={ op:"Em operação", im:"Em implantação", ev:"Estudo de viabilidade" };
(async()=>{
  const svg=d3.select("#map");
  try{
    const topo=await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json");
    const feats=topojson.feature(topo,topo.objects.countries).features;
    const br=feats.find(f=>f.id==="076");
    const proj=d3.geoMercator().fitExtent([[24,24],[W-24,H-24]],br);
    const path=d3.geoPath(proj);
    svg.append("path").attr("class","land").attr("d",path(br));
    const g=svg.append("g");
    // desenha estudos primeiro (atrás), depois implantação, depois operação
    const order={ev:0,im:1,op:2};
    [...cities].sort((a,b)=>order[a.s]-order[b.s]).forEach((city,i)=>{
      const xy=proj(city.c);
      if(!xy) return;
      const [x,y]=xy;
      const col=COLORS[city.s];
      const isEv=city.s==="ev";
      const isOp=city.s==="op";
      const r=isOp?9:isEv?6.5:8;
      const node=g.append("g").attr("transform",`translate(${x},${y})`);
      node.append("circle")
        .attr("class",isEv?"ring-ev":"ring")
        .attr("fill",col)
        .attr("r",r)
        .style("animation-delay",(i*0.09)+"s");
      node.append("circle")
        .attr("class","pin-core")
        .attr("r",r)
        .attr("fill",col)
        .attr("stroke","#fff")
        .attr("stroke-width",isEv?2:2.4)
        .attr("opacity",isEv?0.9:1);
      if(!isEv){
        node.append("circle")
          .attr("r",isOp?3:2.5)
          .attr("fill","#fff")
          .attr("opacity",0.95);
      }
      node.append("title").text(city.n+" — "+LABELS[city.s]);
    });
  }catch(e){
    svg.append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle").attr("fill","#7A8699").text("Mapa indisponível");
  }
})();
</script>
</body>
</html>
