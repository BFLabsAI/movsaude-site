<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" fill="none">
  <!-- Caminhão baú médico completo (cabine + baú) — fundo 100% transparente -->
  <defs>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1B4DA1"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="45%" stop-color="#1B4DA1"/>
      <stop offset="100%" stop-color="#143A7A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2D9CDB"/>
      <stop offset="100%" stop-color="#6BBF3A"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- sombra -->
  <ellipse cx="210" cy="148" rx="175" ry="8" fill="#000" opacity="0.35"/>

  <g filter="url(#sh)">
    <!-- ===== BAÚ (atrás da cabine, à esquerda no sentido: hitch... wait facing RIGHT so cab is RIGHT) ===== -->
    <!-- Vehicle faces RIGHT: cab at right, cargo box to the left of cab... actually standard side view facing right: cab is on the RIGHT front, box behind to the LEFT? 
         No - if facing right, front is right: cab is on the right, box is on the left (behind cab when driving right).
         Standard: facing right = nose right. Cab right, cargo left of cab? Looking at a truck facing right: cab is the rightmost part, cargo is left of the cab.
         Actually looking at typical truck SVG facing right: cab is LEFT (front), cargo is RIGHT (behind). Wait.
         
         Car facing right: front bumper on the right.
         Truck facing right: cab on the right, box on the left? 
         No - truck facing right means the front of the vehicle points right, so cab is on the right side of the drawing.
         
         Standard delivery truck icon facing right: cab on left, box on right - the nose points left in many icons...
         
         MDI truck path - typically cab left, cargo right, driving to the right? The nose of the cab is the left edge.
         
         Looking at typical "truck side view driving right": front is on the RIGHT. Cab is right portion, cargo left.
         
         Actually Wikipedia side views: left of image = rear, right of image = front when facing right? No.
         If vehicle drives to the right, the front of the vehicle is the rightmost part. So cab (front) is on the RIGHT.
         
         I'll put: CAB on the RIGHT (front), BOX on the LEFT (rear). Moving L→R with front leading.
    -->

    <!-- BAÚ / carroceria -->
    <rect x="48" y="38" width="220" height="78" rx="6" fill="url(#box)"/>
    <!-- faixa marca -->
    <rect x="48" y="38" width="220" height="12" rx="6" fill="url(#stripe)"/>
    <rect x="48" y="46" width="220" height="5" fill="url(#stripe)" opacity="0.45"/>
    <!-- painel lateral branco -->
    <rect x="62" y="58" width="160" height="42" rx="4" fill="#F0F7FC" opacity="0.92"/>
    <!-- janelas baú -->
    <rect x="72" y="64" width="36" height="22" rx="3" fill="url(#glass)"/>
    <rect x="118" y="64" width="36" height="22" rx="3" fill="url(#glass)"/>
    <rect x="164" y="64" width="36" height="22" rx="3" fill="url(#glass)"/>
    <!-- cruz médica -->
    <circle cx="230" cy="78" r="14" fill="#fff" opacity="0.15"/>
    <path d="M230 70 V86 M222 78 H238" stroke="#6BBF3A" stroke-width="3.2" stroke-linecap="round"/>
    <!-- porta traseira (esquerda = traseira) -->
    <rect x="52" y="58" width="14" height="48" rx="2" fill="#0F1A38" opacity="0.35"/>
    <!-- luzes traseiras -->
    <rect x="50" y="100" width="8" height="6" rx="1" fill="#EF4444" opacity="0.9"/>
    <rect x="50" y="108" width="8" height="6" rx="1" fill="#FBBF24" opacity="0.85"/>

    <!-- ===== CABINE (frente, à direita) ===== -->
    <path d="M268 52
             H 318
             Q 338 52 348 72
             V 116
             H 268
             Z" fill="url(#cab)"/>
    <!-- teto cabine -->
    <path d="M270 52 H316 Q332 52 340 66 H270 Z" fill="#2D9CDB" opacity="0.5"/>
    <!-- para-brisa -->
    <path d="M292 62 H328 Q336 62 340 74 V 92 H292 Z" fill="url(#glass)"/>
    <!-- janela lateral cabine -->
    <rect x="274" y="64" width="16" height="26" rx="2" fill="url(#glass)" opacity="0.85"/>
    <!-- grade / farol -->
    <rect x="342" y="88" width="8" height="14" rx="1" fill="#0F1A38" opacity="0.4"/>
    <ellipse cx="348" cy="100" rx="5" ry="4" fill="#FEF08A">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="1.1s" repeatCount="indefinite"/>
    </ellipse>
    <!-- para-choque -->
    <rect x="346" y="108" width="10" height="8" rx="1" fill="#1E293B"/>
    <!-- maçaneta -->
    <rect x="280" y="92" width="4" height="8" rx="1" fill="#94A3B8"/>
    <!-- espelho -->
    <rect x="266" y="68" width="5" height="14" rx="1" fill="#334155"/>
    <rect x="264" y="70" width="3" height="8" rx="0.5" fill="url(#glass)"/>

    <!-- chassi / soleira -->
    <rect x="52" y="114" width="298" height="6" rx="2" fill="#0F172A"/>

    <!-- rodas (giram com SMIL) -->
    <g>
      <circle cx="100" cy="124" r="16" fill="#0A0F18" stroke="#2D9CDB" stroke-width="3"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 100 124" to="360 100 124" dur="0.55s" repeatCount="indefinite"/>
        <circle cx="100" cy="124" r="6" fill="#2D9CDB" opacity="0.55"/>
        <path d="M100 112 V136 M88 124 H112" stroke="#7DD3FC" stroke-width="1.5" opacity="0.45"/>
      </g>
    </g>
    <g>
      <circle cx="175" cy="124" r="16" fill="#0A0F18" stroke="#2D9CDB" stroke-width="3"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 175 124" to="360 175 124" dur="0.55s" repeatCount="indefinite"/>
        <circle cx="175" cy="124" r="6" fill="#2D9CDB" opacity="0.55"/>
        <path d="M175 112 V136 M163 124 H187" stroke="#7DD3FC" stroke-width="1.5" opacity="0.45"/>
      </g>
    </g>
    <g>
      <circle cx="310" cy="124" r="16" fill="#0A0F18" stroke="#2D9CDB" stroke-width="3"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 310 124" to="360 310 124" dur="0.55s" repeatCount="indefinite"/>
        <circle cx="310" cy="124" r="6" fill="#2D9CDB" opacity="0.55"/>
        <path d="M310 112 V136 M298 124 H322" stroke="#7DD3FC" stroke-width="1.5" opacity="0.45"/>
      </g>
    </g>
  </g>

  <!-- texto sutil no baú -->
  <text x="100" y="108" fill="#FFFFFF" fill-opacity="0.35" font-family="system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="1">MOVSAÚDE</text>
</svg>
